name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php-lint:
    name: PHP lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.2' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        run: |
          set -e
          for f in $(find . -name '*.php' -type f); do
            php -l "$f"
          done
